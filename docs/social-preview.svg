<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Voicemail to Caller SMS Auto-Reply</title>
  <desc id="desc">Social preview for a privacy-first, provider-neutral Google Apps Script automation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b5563"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48cae4"/>
      <stop offset="1" stop-color="#80ed99"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020b16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1130" cy="80" r="250" fill="#48cae4" opacity="0.08"/>
  <circle cx="120" cy="620" r="290" fill="#80ed99" opacity="0.06"/>

  <g transform="translate(88 82)">
    <rect width="1104" height="476" rx="32" fill="#0b1f33" opacity="0.92" stroke="#ffffff" stroke-opacity="0.12" filter="url(#shadow)"/>

    <g transform="translate(62 64)">
      <rect width="88" height="88" rx="24" fill="url(#accent)"/>
      <path d="M24 27h40a8 8 0 0 1 8 8v23a8 8 0 0 1-8 8H43L29 77V66h-5a8 8 0 0 1-8-8V35a8 8 0 0 1 8-8Z" fill="#071426"/>
      <path d="M30 41h28M30 52h20" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <text x="174" y="105" fill="#8be9fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="3">OPEN-SOURCE AUTOMATION</text>
    <text x="62" y="218" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800">Voicemail → Caller SMS</text>
    <text x="62" y="292" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800">Auto-Reply</text>
    <text x="62" y="346" fill="#b9d6e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27">Privacy-first • Provider-neutral • Google Apps Script</text>

    <g transform="translate(62 386)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="650">
      <rect width="210" height="48" rx="24" fill="#173b57" stroke="#48cae4" stroke-opacity="0.55"/>
      <text x="105" y="31" text-anchor="middle" fill="#d9f7ff">Gmail ingestion</text>
      <rect x="228" width="210" height="48" rx="24" fill="#173b57" stroke="#48cae4" stroke-opacity="0.55"/>
      <text x="333" y="31" text-anchor="middle" fill="#d9f7ff">5 SMS adapters</text>
      <rect x="456" width="230" height="48" rx="24" fill="#173b57" stroke="#80ed99" stroke-opacity="0.55"/>
      <text x="571" y="31" text-anchor="middle" fill="#e1ffea">Dry-run + dedup</text>
      <rect x="704" width="250" height="48" rx="24" fill="#173b57" stroke="#80ed99" stroke-opacity="0.55"/>
      <text x="829" y="31" text-anchor="middle" fill="#e1ffea">Privacy controls</text>
    </g>
  </g>
</svg>
